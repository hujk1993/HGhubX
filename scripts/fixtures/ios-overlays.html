<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iOS overlay interaction fixture</title>
    <style>
      /* Keep this behavior fixture independent of the app's visual theme. */
      body { margin: 0; }
      button, input, [tabindex] { margin: 4px; }
      .ios-overlay { position: fixed; inset: 0; z-index: calc(260 + var(--ios-overlay-order, 0)); display: grid; place-items: center; }
      .ios-overlay-backdrop { position: absolute; inset: 0; background: #7775; }
      .ios-dialog { position: relative; min-width: 200px; padding: 24px; border: 2px solid #555; background: white; }
      .is-closing { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <aside id="pre-inert" inert><button>Previously inert background</button></aside>
    <div id="root"></div>
    <script type="module" src="./ios-overlays.tsx"></script>
  </body>
</html>
