<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101012" />
    <title>HGhubX · 短剧</title>
    <script>
      try {
        // 旧主题仅用于首次升级的首帧；React 启动后会迁移并清理旧键。
        const preference = localStorage.getItem("hghubx_theme") ?? localStorage.getItem("hghub_theme");
        const dark = preference === "dark" || (preference !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (!dark) document.documentElement.classList.add("theme-light");
        document.querySelector('meta[name="theme-color"]').content = dark ? "#121212" : "#eeece7";
      } catch (e) {}
    </script>
    <style>html,body{background:#121212}html.theme-light,html.theme-light body{background:#eeece7}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
