name: Tauri Build Android arm64 Debug
on:
  workflow_dispatch:
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: llvm-tools-preview

      - name: Cache Rust
        uses: swatinem/rust-cache@v2

      - name: Install deps
        run: pnpm install

      - name: Build frontend
        run: pnpm build

      - name: Init Android project
        run: pnpm tauri android init

      - name: Build arm64-only debug APK
        run: pnpm tauri android build --apk --debug --target aarch64

      # 体积优化，失败不中断任务
      - name: Strip .so 精简体积
        run: |
          find src-tauri/gen/android -type f -name "*.so" -exec rust-llvm-strip {} \;
        continue-on-error: true

      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-debug-apk
          path: $(find src-tauri/gen/android -name "*debug*.apk" | head -n1)
