name: Tauri Build Windows EXE
on:
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # 重点：删掉 cache: 'pnpm'，避免提前去找pnpm报错

      - name: Corepack enable 启用pnpm（Windows最稳方案）
        run: |
          npm install -g corepack
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install
        env:
          npm_config_registry: https://registry.npmmirror.com

      - name: Run Tauri build
        run: pnpm tauri build -- --bundles nsis
        env:
          TAURI_BUNDLER_TOOLS_GITHUB_MIRROR: https://mirror.ghproxy.com

      - name: Upload exe installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
