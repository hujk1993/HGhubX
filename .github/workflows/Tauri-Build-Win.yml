name: Tauri Build Windows EXE
on:
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # 关键：自动安装pnpm，解决 Unable to locate executable file: pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install
        env:
          npm_config_registry: https://registry.npmmirror.com

      - name: Run Tauri build
        run: pnpm tauri build -- --bundles nsis
        env:
          TAURI_BUNDLER_TOOLS_GITHUB_MIRROR: https://mirror.ghproxy.com

      - name: Upload exe installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
