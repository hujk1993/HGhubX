name: Test Preview
run-name: "Test Preview · ${{ github.event_name == 'workflow_dispatch' && inputs.platforms != 'all' && format('manual ({0})', inputs.platforms) || (github.event_name == 'workflow_dispatch' && 'manual (all)' || 'auto build') }}"

# 全平台测试预览构建与发布工作流：
# - 自动模式：监听 `Sync Test Branch` 完成事件（workflow_run），不直接挂载在 PR 检查页上，
#   因此并发取消旧构建时绝不会把任何 PR 标红或标取消；
# - 手动模式：支持按需选择 `all` 或单平台重编并原地更新 `test-pre` 对应资产；
# - 隔离安全：6 平台构建机无密钥，独立干净运行器签名 APK 并原地零空窗滚动更新 `test-pre`。
on:
  workflow_run:
    workflows: ["Sync Test Branch"]
    types: [completed]
  workflow_dispatch:
    inputs:
      platforms:
        description: "构建平台范围：all 全平台；或指定单平台覆盖更新 test-pre 对应产物"
        type: choice
        default: all
        options: [all, windows, android, android-tv, macos, ios, linux]

permissions:
  contents: read

env:
  CI: "true"

jobs:
  prepare:
    name: Prepare test preview metadata
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    outputs:
      should_build: ${{ steps.meta.outputs.should_build }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - name: 下载 Sync Test Branch 元数据
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: test-sync-bundle
          path: test-sync-bundle
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          node-version: 22
      - name: 手动触发时同步 test 分支
        id: manual_sync
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_NOTES_PATH: test-sync-bundle/test-release-notes.md
        run: |
          mkdir -p test-sync-bundle
          node scripts/sync-test-branch.mjs
          node -e '
            const fs = require("node:fs");
            const out = fs.readFileSync(process.env.GITHUB_OUTPUT, "utf8");
            const read = (k) => (out.match(new RegExp("^" + k + "=(.*)$", "m"))?.[1] || "").trim();
            fs.writeFileSync("test-sync-bundle/meta.json", JSON.stringify({
              should_build: read("should_build") === "true",
              commit_sha: read("commit_sha"),
              short_sha: read("short_sha"),
            }, null, 2));
          '
      - name: 解析构建元数据
        id: meta
        run: |
          node -e '
            const fs = require("node:fs");
            const meta = JSON.parse(fs.readFileSync("test-sync-bundle/meta.json", "utf8"));
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              `should_build=${meta.should_build ? "true" : "false"}\n` +
              `commit_sha=${meta.commit_sha || ""}\n` +
              `short_sha=${meta.short_sha || ""}\n`);
            console.log("Resolved preview metadata:", JSON.stringify(meta));
          '
      - uses: actions/upload-artifact@v7
        if: steps.meta.outputs.should_build == 'true'
        with:
          name: test-release-notes
          path: test-sync-bundle/test-release-notes.md
          if-no-files-found: error

  windows:
    name: Test · Windows (setup + portable)
    needs: [prepare]
    if: >-
      needs.prepare.outputs.should_build == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'windows')
    concurrency:
      group: test-preview-windows
      cancel-in-progress: true
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
      - name: 读取版本号
        id: ver
        shell: bash
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          node scripts/set-version.mjs "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-node-pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
      - name: 构建（NSIS 安装包）
        run: pnpm tauri build --bundles nsis
      - name: 收集产物（安装包 + 便携包）
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" artifacts/
          $bin = "src-tauri/target/release/hghubx.exe"
          if (-not (Test-Path $bin)) {
            $bin = (Get-ChildItem "src-tauri/target/release" -Filter *.exe | Select-Object -First 1).FullName
          }
          Copy-Item $bin "artifacts/HGhubX.exe"
          Compress-Archive -Path "artifacts/HGhubX.exe" -DestinationPath "artifacts/HGhubX_${v}_x64_portable.zip" -Force
          Remove-Item "artifacts/HGhubX.exe"
          Get-ChildItem artifacts | Select-Object Name, Length
      - uses: actions/upload-artifact@v7
        with:
          name: ready-windows
          path: artifacts/*
          if-no-files-found: error

  android:
    name: Test · Android (split per ABI)
    needs: [prepare]
    if: >-
      needs.prepare.outputs.should_build == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'android')
    concurrency:
      group: test-preview-android
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
      - name: 读取版本号
        id: ver
        shell: bash
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          node scripts/set-version.mjs "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/setup-android-sdk
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
          key: android-standard
      - name: 生成 Android 工程
        run: pnpm tauri android init --ci
      - name: 编译未签名 APK（按 ABI 分包）
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          pnpm tauri android build --apk --split-per-abi --target aarch64 armv7 x86_64
          mkdir -p unsigned
          found=0
          for f in $(find src-tauri/gen/android/app/build/outputs/apk -name '*-release*.apk'); do
            abi="$(basename "$(dirname "$(dirname "$f")")")"
            cp "$f" "unsigned/HGhubX_${VERSION}_${abi}.apk"
            found=$((found+1))
          done
          if [ "$found" -eq 0 ]; then echo "::error::没有找到 Android release APK"; exit 1; fi
          ls -lh unsigned
      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-android
          path: unsigned/*
          if-no-files-found: error

  android-tv:
    name: Test · Android TV (split per ABI)
    needs: [prepare]
    if: >-
      needs.prepare.outputs.should_build == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'android-tv')
    concurrency:
      group: test-preview-android-tv
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
      - name: 读取 TV 版本号
        id: ver
        shell: bash
        run: |
          V="$(node -p "require('./src-tauri/tauri.tv.conf.json').version")"
          node scripts/set-version.mjs --target tv "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "HGHUBX_APP_VERSION=$V" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/setup-android-sdk
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
          key: android-tv
      - name: 选择 Android TV 配置并生成工程
        run: |
          cp src-tauri/tauri.tv.conf.json src-tauri/tauri.android.conf.json
          pnpm tauri android init --ci
      - name: 编译未签名 TV APK（按 ABI 分包）
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          pnpm tauri android build --apk --split-per-abi --target aarch64 armv7 x86_64
          mkdir -p unsigned
          found=0
          for f in $(find src-tauri/gen/android/app/build/outputs/apk -name '*-release*.apk'); do
            abi="$(basename "$(dirname "$(dirname "$f")")")"
            cp "$f" "unsigned/HGhubX-TV_${VERSION}_${abi}.apk"
            found=$((found+1))
          done
          if [ "$found" -eq 0 ]; then echo "::error::没有找到 TV release APK"; exit 1; fi
          ls -lh unsigned
      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-android-tv
          path: unsigned/*
          if-no-files-found: error

  macos:
    name: Test · macOS (universal dmg)
    needs: [prepare]
    if: >-
      needs.prepare.outputs.should_build == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'macos')
    concurrency:
      group: test-preview-macos
      cancel-in-progress: true
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
      - name: 读取版本号
        id: ver
        shell: bash
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          node scripts/set-version.mjs "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-node-pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
          key: macos
      - name: 构建（Universal dmg）
        run: pnpm tauri build --target universal-apple-darwin
      - name: 收集产物
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp "src-tauri/target/universal-apple-darwin/release/bundle/dmg/"*.dmg \
             "artifacts/HGhubX_${{ steps.ver.outputs.version }}_universal.dmg"
          ls -lh artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: ready-macos
          path: artifacts/*
          if-no-files-found: error

  ios:
    name: Test · iOS (unsigned ipa)
    needs: [prepare]
    if: >-
      needs.prepare.outputs.should_build == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'ios')
    concurrency:
      group: test-preview-ios
      cancel-in-progress: true
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"
      APPLE_DEVELOPMENT_TEAM: "ABCDE12345"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
      - name: 读取版本号
        id: ver
        shell: bash
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          node scripts/set-version.mjs "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-node-pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
          key: ios
      - uses: ./.github/actions/setup-ios-project
      - name: 构建并打包 ipa
        shell: bash
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: bash scripts/build-ios-unsigned.sh "$APP_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: ready-ios
          path: artifacts/*
          if-no-files-found: error

  linux:
    name: Test · Linux (deb)
    needs: [prepare]
    if: >-
      needs.prepare.outputs.should_build == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'linux')
    concurrency:
      group: test-preview-linux
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
      - name: 读取版本号
        id: ver
        shell: bash
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          node scripts/set-version.mjs "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/install-webkitgtk
        with:
          cache-key: apt-webkit-ubuntu22-v1
      - uses: ./.github/actions/setup-node-pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
          key: linux
      - name: 构建（deb）
        run: pnpm tauri build
      - name: 收集产物
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/deb/*.deb "artifacts/HGhubX_${{ steps.ver.outputs.version }}_amd64.deb"
          ls -lh artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: ready-linux
          path: artifacts/*
          if-no-files-found: error

  publish-test-pre:
    name: Sign & Publish test-pre Pre-release
    needs: [prepare, windows, android, android-tv, macos, linux, ios]
    # 独立干净运行器（不检出 PR 代码）：按平台范围签名 APK 并原地零空窗滚动更新 `test-pre`
    if: >-
      always() &&
      !cancelled() &&
      needs.prepare.outputs.should_build == 'true' &&
      (
        ((github.event_name != 'workflow_dispatch' || inputs.platforms == 'all') &&
          needs.windows.result == 'success' &&
          needs.android.result == 'success' &&
          needs.android-tv.result == 'success' &&
          needs.macos.result == 'success' &&
          needs.linux.result == 'success' &&
          (needs.ios.result == 'success' || needs.ios.result == 'failure')) ||
        (github.event_name == 'workflow_dispatch' && inputs.platforms == 'windows' && needs.windows.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.platforms == 'android' && needs.android.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.platforms == 'android-tv' && needs.android-tv.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.platforms == 'macos' && needs.macos.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.platforms == 'ios' && needs.ios.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.platforms == 'linux' && needs.linux.result == 'success')
      )
    concurrency:
      group: test-preview-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: 下载构建产物与版本说明
        uses: actions/download-artifact@v8
        with:
          path: downloaded
      - name: 隔离签名 Android / TV APK 并汇总待发布产物
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for dir in downloaded/ready-*; do
            [ -d "$dir" ] || continue
            cp "$dir"/* release-assets/
          done

          shopt -s nullglob
          UNSIGNED_APKS=(downloaded/unsigned-*/*.apk)
          if [ "${#UNSIGNED_APKS[@]}" -gt 0 ]; then
            if [ -z "${KEYSTORE_BASE64:-}" ]; then
              echo "::error::缺少 ANDROID_KEY_BASE64 secret，无法签名测试 APK"; exit 1
            fi
            SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
            BT="$(ls "$SDK/build-tools" 2>/dev/null | sort -V | tail -1 || true)"
            if [ -z "$BT" ]; then
              SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
              yes | "$SDKM" --licenses > /dev/null 2>&1 || true
              "$SDKM" --install "build-tools;36.0.0"
              BT="36.0.0"
            fi
            APKSIGNER="$SDK/build-tools/$BT/apksigner"
            AAPT2="$SDK/build-tools/$BT/aapt2"
            KS="$RUNNER_TEMP/release.keystore"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            for f in "${UNSIGNED_APKS[@]}"; do
              out="release-assets/$(basename "$f")"
              "$APKSIGNER" sign \
                --ks "$KS" --ks-key-alias "$KEY_ALIAS" \
                --ks-pass "pass:$STORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
                --v4-signing-enabled false \
                --out "$out" "$f"
              "$APKSIGNER" verify --print-certs "$out" | head -3
              "$AAPT2" dump badging "$out" | grep -m1 "^package:"
            done
            rm -f "$KS"
          fi

          shopt -u nullglob
          if [ -z "$(ls -A release-assets)" ]; then
            echo "::error::未找到任何待发布产物"; exit 1
          fi
          ls -lh release-assets
      - name: 原地滚动更新 test-pre 预发布页（零 404 空窗，不抢占 Latest）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TEST_SHA: ${{ needs.prepare.outputs.commit_sha }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
          SELECTED_PLATFORMS: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'all' }}
        run: |
          set -euo pipefail
          if gh release view test-pre --repo "$REPO" >/dev/null 2>&1; then
            if gh api "repos/$REPO/git/refs/tags/test-pre" >/dev/null 2>&1; then
              gh api -X PATCH "repos/$REPO/git/refs/tags/test-pre" -f sha="$TEST_SHA" -F force=true >/dev/null
            else
              gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/test-pre" -f sha="$TEST_SHA" >/dev/null
            fi
            gh release upload test-pre release-assets/* --clobber --repo "$REPO"
            if [ "$SELECTED_PLATFORMS" = "all" ]; then
              NEW_NAMES="$(cd release-assets && printf '%s\n' *)"
              OLD_NAMES="$(gh release view test-pre --repo "$REPO" --json assets --jq '.assets[].name')"
              while IFS= read -r old; do
                [ -n "$old" ] || continue
                if ! printf '%s\n' "$NEW_NAMES" | grep -Fxq "$old"; then
                  gh release delete-asset test-pre "$old" --yes --repo "$REPO" || true
                fi
              done <<< "$OLD_NAMES"
            fi
            gh release edit test-pre \
              --repo "$REPO" \
              --title "HGhubX Test Preview (${SHORT_SHA})" \
              --notes-file downloaded/test-release-notes/test-release-notes.md \
              --prerelease \
              --latest=false
          else
            gh release create test-pre release-assets/* \
              --repo "$REPO" \
              --target "$TEST_SHA" \
              --title "HGhubX Test Preview (${SHORT_SHA})" \
              --notes-file downloaded/test-release-notes/test-release-notes.md \
              --prerelease \
              --latest=false
          fi
