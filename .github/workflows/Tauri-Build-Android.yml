name: Tauri Build Android APK
on:
  workflow_dispatch:
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install
        env:
          npm_config_registry: https://registry.npmmirror.com

      - name: Install Android deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Init Android project
        run: pnpm tauri android init --skip-targets-install
        env:
          TAURI_ANDROID_PACKAGE_NAME: com.hghubx.app
          TAURI_ANDROID_APP_NAME: hghubx

      - name: Build Android Debug APK
        run: pnpm tauri android build --debug

      - name: Upload debug apk
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/debug/app-debug.apk
