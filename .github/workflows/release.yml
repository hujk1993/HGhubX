name: Release
run-name: "Release · ${{ inputs.tag != '' && inputs.tag || github.ref_name }}${{ inputs.platforms != '' && inputs.platforms != 'all' && format(' ({0})', inputs.platforms) || '' }}"

# 标准版打包与发布（CD）：推送 v* tag 或手动触发时先跑轻量前置门禁，再按平台编译并发布标准版 GitHub Release。
# 日常 CI 校验见 .github/workflows/ci.yml；TV 版独立发版见 .github/workflows/tv-release.yml。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "打包范围：all 标准版全平台，或指定单一平台"
        type: choice
        default: all
        options: [all, android-arm64, android, linux, windows, macos, ios]
      quick:
        description: "快速编译：thin LTO + 4 个 codegen 单元，快一倍（勾选时不发布 Release）"
        type: boolean
        default: true
      tag:
        description: "发版 tag（如 v2.2.6）：配合 platforms=all 且 quick=false 发布 Release；留空只出产物"
        type: string
        default: ""
      prerelease:
        description: "标记为 Pre-release（预发布，不出正式版）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.platforms || 'all' }}-${{ (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '') && github.run_id || 'quick' }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' }}

env:
  CI: "true"

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - name: 校验版本号与发布说明
        id: ver
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
            V="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
            V="${INPUT_TAG#v}"
          else
            TAG=""
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          node scripts/set-version.mjs "$V"
          node scripts/check-i18n.mjs
          node scripts/check-doc-links.mjs
          if [[ -n "$TAG" && ! -f "docs/release-notes/${TAG}.md" ]]; then
            echo "::notice::未找到 docs/release-notes/${TAG}.md，发布时将回退自动生成说明"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows (setup + portable)
    needs: [preflight]
    runs-on: windows-latest
    timeout-minutes: 60
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.platforms == 'all' ||
      inputs.platforms == 'windows'
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ inputs.quick && 'thin' || 'true' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ inputs.quick && '4' || '1' }}
    steps:
      - uses: actions/checkout@v7
      - name: 版本号对齐 tag
        shell: bash
        run: node scripts/set-version.mjs "${{ needs.preflight.outputs.version }}"
      - uses: ./.github/actions/setup-node-pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
      - name: 构建（NSIS 安装包）
        run: pnpm tauri build --bundles nsis
      - name: 收集产物（安装包 + 便携包）
        shell: pwsh
        run: |
          $v = "${{ needs.preflight.outputs.version }}"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" artifacts/
          $bin = "src-tauri/target/release/hghubx.exe"
          if (-not (Test-Path $bin)) {
            $bin = (Get-ChildItem "src-tauri/target/release" -Filter *.exe | Select-Object -First 1).FullName
          }
          Copy-Item $bin "artifacts/HGhubX.exe"
          Compress-Archive -Path "artifacts/HGhubX.exe" -DestinationPath "artifacts/HGhubX_${v}_x64_portable.zip" -Force
          Remove-Item "artifacts/HGhubX.exe"
          Get-ChildItem artifacts | Select-Object Name, Length
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: artifacts/*
          if-no-files-found: error

  android:
    name: Android (split per ABI)
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.platforms == 'all' ||
      inputs.platforms == 'android' ||
      inputs.platforms == 'android-arm64'
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ inputs.quick && 'thin' || 'true' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ inputs.quick && '4' || '1' }}
    steps:
      - uses: actions/checkout@v7
      - name: 版本号对齐 tag
        shell: bash
        run: node scripts/set-version.mjs "${{ needs.preflight.outputs.version }}"
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/setup-android-sdk
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
          key: android-standard
      - name: 生成 Android 工程
        run: pnpm tauri android init --ci
      - name: 编译 APK（按 ABI 分包）
        run: |
          if [ "${{ inputs.platforms }}" = "android-arm64" ]; then
            TARGETS="aarch64"
          elif [ "${{ inputs.quick }}" = "true" ]; then
            TARGETS="aarch64 armv7"
          else
            TARGETS="aarch64 armv7 x86_64"
          fi
          echo "targets: $TARGETS"
          pnpm tauri android build --apk --split-per-abi --target $TARGETS
      - name: 签名 APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 ANDROID_KEY_BASE64 secret，无法签名"; exit 1
          fi
          PREFIX="HGhubX"
          KS="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          BT="$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BT/apksigner"
          mkdir -p artifacts
          found=0
          for f in $(find src-tauri/gen/android/app/build/outputs/apk -name '*-release*.apk'); do
            abi="$(basename "$(dirname "$(dirname "$f")")")"
            out="artifacts/${PREFIX}_${VERSION}_${abi}.apk"
            "$APKSIGNER" sign \
              --ks "$KS" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$STORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
              --v4-signing-enabled false \
              --out "$out" "$f"
            "$APKSIGNER" verify --print-certs "$out" | head -3
            found=$((found+1))
          done
          rm -f "$KS"
          if [ "$found" -eq 0 ]; then echo "::error::没有找到 release APK"; exit 1; fi
          AAPT2="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/aapt2 | sort -V | tail -1)"
          for a in artifacts/*.apk; do "$AAPT2" dump badging "$a" | grep -m1 "^package:"; done
          ls -lh artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: artifacts/*
          if-no-files-found: error

  macos:
    name: macOS (universal dmg)
    needs: [preflight]
    runs-on: macos-latest
    timeout-minutes: 60
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.platforms == 'all' ||
      inputs.platforms == 'macos'
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ inputs.quick && 'thin' || 'true' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ inputs.quick && '4' || '1' }}
    steps:
      - uses: actions/checkout@v7
      - name: 版本号对齐 tag
        shell: bash
        run: node scripts/set-version.mjs "${{ needs.preflight.outputs.version }}"
      - uses: ./.github/actions/setup-node-pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
          key: macos
      - name: 构建（Universal dmg）
        run: |
          if [ "${{ inputs.quick }}" = "true" ]; then
            pnpm tauri build --target aarch64-apple-darwin
          else
            pnpm tauri build --target universal-apple-darwin
          fi
      - name: 收集产物
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          DIR=universal-apple-darwin
          SUFFIX=universal
          if [ "${{ inputs.quick }}" = "true" ]; then DIR=aarch64-apple-darwin; SUFFIX=arm64; fi
          cp "src-tauri/target/$DIR/release/bundle/dmg/"*.dmg \
             "artifacts/HGhubX_${{ needs.preflight.outputs.version }}_${SUFFIX}.dmg"
          ls -lh artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: artifacts/*
          if-no-files-found: error

  ios:
    name: iOS (unsigned ipa)
    needs: [preflight]
    runs-on: macos-latest
    timeout-minutes: 60
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.platforms == 'all' ||
      inputs.platforms == 'ios'
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ inputs.quick && 'thin' || 'true' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ inputs.quick && '4' || '1' }}
      APPLE_DEVELOPMENT_TEAM: "ABCDE12345"
    steps:
      - uses: actions/checkout@v7
      - name: 版本号对齐 tag
        shell: bash
        run: node scripts/set-version.mjs "${{ needs.preflight.outputs.version }}"
      - uses: ./.github/actions/setup-node-pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
          key: ios
      - uses: ./.github/actions/setup-ios-project
      - name: 构建并打包 ipa
        shell: bash
        env:
          APP_VERSION: ${{ needs.preflight.outputs.version }}
        run: bash scripts/build-ios-unsigned.sh "$APP_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: artifacts/*
          if-no-files-found: error

  linux:
    name: Linux (deb)
    needs: [preflight]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.platforms == 'all' ||
      inputs.platforms == 'linux'
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ inputs.quick && 'thin' || 'true' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ inputs.quick && '4' || '1' }}
    steps:
      - uses: actions/checkout@v7
      - name: 版本号对齐 tag
        shell: bash
        run: node scripts/set-version.mjs "${{ needs.preflight.outputs.version }}"
      - uses: ./.github/actions/install-webkitgtk
        with:
          cache-key: apt-webkit-ubuntu22-v1
      - uses: ./.github/actions/setup-node-pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
          key: linux
      - name: 构建（deb）
        run: pnpm tauri build
      - name: 收集产物
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/deb/*.deb "artifacts/HGhubX_${{ needs.preflight.outputs.version }}_amd64.deb"
          ls -lh artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [windows, android, macos, linux, ios]
    # iOS 失败时不能把整包卡住，但成功时要等它的 ipa 一起发；其余平台必须全部成功且工作流未被取消
    if: >-
      always() &&
      !cancelled() &&
      needs.windows.result == 'success' &&
      needs.android.result == 'success' &&
      needs.macos.result == 'success' &&
      needs.linux.result == 'success' &&
      (needs.ios.result == 'success' || needs.ios.result == 'failure') &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.platforms == 'all' && !inputs.quick))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: 列出待发布文件
        run: ls -lh artifacts
      - name: 取版本说明
        id: notes
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          F="docs/release-notes/${TAG}.md"
          if [ -f "$F" ]; then
            echo "body_path=$F" >> "$GITHUB_OUTPUT"
            echo "使用 $F"
          else
            echo "body_path=" >> "$GITHUB_OUTPUT"
            echo "没有 $F，回退自动生成的说明"
          fi
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          body_path: ${{ steps.notes.outputs.body_path }}
          files: artifacts/*
          generate_release_notes: ${{ steps.notes.outputs.body_path == '' }}
          prerelease: ${{ inputs.prerelease || contains(inputs.tag != '' && inputs.tag || github.ref_name, '-') }}
          fail_on_unmatched_files: true
