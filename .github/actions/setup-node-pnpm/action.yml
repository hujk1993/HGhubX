name: Setup Node and pnpm
description: Configure pnpm 10, Node 22 with pnpm cache, and optionally install frozen dependencies.

inputs:
  install:
    description: "Whether to run pnpm install --frozen-lockfile"
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: 10
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
